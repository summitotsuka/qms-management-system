<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QMS Management System</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #333;
      color: white;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.85;
    }

    #result {
      margin-top: 25px;
    }

    .success {
      padding: 20px;
      background: #e9f7ef;
      border-radius: 8px;
    }

    .error {
      padding: 20px;
      background: #fdecec;
      border-radius: 8px;
      color: #a00;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>QMS Management System</h1>

    <p>
      ISO 9001 / IATF 16949
    </p>

    <hr>

    <p>
      Backend Connection Test
    </p>

    <button onclick="testBackend()">
      Test Backend
    </button>

    <div id="result">
      Waiting for test...
    </div>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>

</html>

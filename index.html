<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Integrated Management System
  </title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>


<body>

<div class="app">


  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="sidebar-header">

      <div>

        <div class="logo">
          IMS
        </div>

        <div class="logo-subtitle">
          Integrated Management
        </div>

      </div>

    </div>


    <nav
      id="sidebarMenu"
      class="sidebar-menu"
    ></nav>

  </aside>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">


    <!-- TOPBAR -->

    <header class="topbar">

      <button
        id="sidebarToggle"
        class="sidebar-toggle"
      >
        ☰
      </button>


      <div class="user-area">

        <div>

          <div>
            Guest User
          </div>

          <small>
            Administrator
          </small>

        </div>

        <div class="user-avatar">
          👤
        </div>

      </div>

    </header>



    <!-- CONTENT -->

    <section
      id="pageContent"
      class="content"
    ></section>


  </main>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/navigation.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/app.js"></script>


</body>

</html>
